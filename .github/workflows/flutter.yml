name: Flutter checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform runners
        run: flutter create . --platforms=android,web --project-name=caffeine_cafe_mobile
      - name: Install dependencies
        run: flutter pub get
      - name: Format Dart files
        run: dart format lib test
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build web release
        run: flutter build web --release
      - name: Build Android debug APK
        run: flutter build apk --debug
